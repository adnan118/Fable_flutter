name: RC123 Android Media3 real protected H264 decoder

on:
  pull_request:
    paths:
      - '.github/workflows/rc123-media3-emulator.yml'
      - 'test/rc123-android-media3-decoder-audit.test.mjs'
      - 'integration_test/rc122_protected_video_test.dart'
      - 'packages/features/fable_media/**'
      - 'android/**'
      - 'assets/videos/rc122_blue_h264.mp4'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  android-protected-h264:
    name: Android emulator Media3 actual H264 decoder (not Backend E2E)
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Verify preinstalled Android SDK without obsolete legacy tools package
        shell: bash
        run: |
          set -euo pipefail
          test -d "${ANDROID_HOME:?Android SDK missing from hosted Ubuntu runner}"
          command -v sdkmanager
          sdkmanager --version
          command -v adb
      - name: Verify immutable audited source fixture
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git hash-object assets/videos/rc122_blue_h264.mp4)" == "e477b0298e79f42fc73c3270c36a5b032579b713" ]]
          [[ "$(wc -c < assets/videos/rc122_blue_h264.mp4)" -eq 1569 ]]
          flutter pub get
      - name: Enable KVM for actual Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Play real H264 MP4 via bounded Dart range bridge and Media3
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            adb wait-for-device
            [[ "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" -ge 35 ]]
            flutter devices
            flutter test integration_test/rc122_protected_video_test.dart -d emulator-5554 --reporter=expanded
