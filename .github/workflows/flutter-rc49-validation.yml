name: Fable Flutter RC49 validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-rc49-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  flutter-source:
    name: Flutter dependencies, analyze, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify imported Fable contract source (never implies project/live acceptance)
        run: |
          node --test test/contract-acceptance.test.mjs test/session-policy-for-wizard.test.mjs
          node tools/verify-fable-contract.mjs --mode source
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Record SDK versions
        run: |
          flutter --version
          dart --version
      - name: Install app dependencies
        run: flutter pub get
      - name: Resolve dependencies for all optional packages
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r spec; do
            package="${spec%/pubspec.yaml}"
            echo "::group::Dependencies $package"
            (cd "$package" && flutter pub get)
            echo "::endgroup::"
          done < <(find packages -name pubspec.yaml -type f | sort)
      - name: Analyze Flutter application and feature libraries
        run: flutter analyze --no-fatal-infos
      - name: Test Flutter application
        run: flutter test --reporter expanded
      - name: Test all independent feature packages
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r spec; do
            package="${spec%/pubspec.yaml}"
            if [[ ! -d "$package/test" ]] || ! find "$package/test" -name '*_test.dart' -print -quit | grep -q .; then
              continue
            fi
            echo "::group::Testing $package"
            (cd "$package" && flutter pub get && flutter test --reporter expanded)
            echo "::endgroup::"
          done < <(find packages -name pubspec.yaml -type f | sort)

  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build Android APK (unsigned production, debug only)
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fable-rc49-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios-unsigned:
    name: iOS simulator build (no signing)
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Verify modern Xcode toolchain
        run: xcodebuild -version
      - name: Build iOS simulator (does not require signing)
        run: flutter build ios --simulator --debug --no-codesign
