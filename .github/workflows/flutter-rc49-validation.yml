name: Fable Flutter RC49 validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-rc49-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  flutter-source:
    name: Flutter dependencies, analyze, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify imported Fable contract source (never implies project/live acceptance)
        run: |
          node --test test/contract-acceptance.test.mjs test/session-policy-for-wizard.test.mjs test/flutter-setup-wizard.test.mjs test/feature-sync.test.mjs test/backend-feature-parity-audit.test.mjs test/frontend-feature-ownership.test.mjs test/external-backend-isolation.test.mjs test/managed-access-context-wizard.test.mjs test/rc105-scoped-feature-audit.test.mjs
          node tools/verify-fable-contract.mjs --mode source
          # RC80: حراسة سجل الميزات؛ لا نعلن اكتمالاً لمجرد نجاح CI.
          # RC97: Web/Admin are separate browser-client contracts, never Flutter runtime endpoints.
          node --test test/rc106-pinned-managed-generator.test.mjs
          node --test test/rc108-notification-identity-audit.test.mjs
          node --test test/rc110-media-identity-audit.test.mjs
          node --test test/rc111-media-widget-audit.test.mjs
          node --test test/rc112-protected-playback-audit.test.mjs
          node --test test/rc113-protected-media-range-audit.test.mjs
          node --test test/rc114-media-architecture-gate.test.mjs
          node tools/enforce-media-architecture-rc114.mjs
          node --test test/rc115-feature-architecture-gate.test.mjs
          node tools/enforce-feature-architecture-rc115.mjs
          node --test test/rc116-typed-feature-codegen.test.mjs
          node --test test/rc117-player-session-boundary-audit.test.mjs
          node --test test/rc119-protected-player-broker-audit.test.mjs
          python3 tools/verify-uiscene-rc120.py
          node --test test/rc120-native-player-audit.test.mjs
          node --test test/rc120-uiscene-launch-gate-audit.test.mjs
          node --test test/rc121-native-lease-audit.test.mjs
          node --test test/rc122-protected-video-audit.test.mjs
          node --test test/rc123-android-media3-decoder-audit.test.mjs
          node --test test/rc124-native-player-lifecycle-audit.test.mjs
          # The generated feature below is *synthetic*, never treated as real project verification.
          node tools/rc116-ci-compile-fixture.mjs --ci-mock-only
          node tools/enforce-feature-architecture-rc115.mjs
          node --test test/web-admin-auth-client-rc97.test.mjs
          node --test test/feature-parity-master.test.mjs
          node --test test/backend-wide-decision-review.test.mjs
          node tools/verify-feature-parity-master.mjs
          # RC86: source-pair pin is not E2E acceptance, and Other stays isolated.
          node --test test/cross-repo-source-pair-rc86.test.mjs
          node tools/verify-cross-repo-source-pair.mjs
          node --test test/offline-sync-wizard-rc89.test.mjs
          node --test test/selected-feature-integration-rc90.test.mjs
          # CI starter is not production-backed: show all gaps but do not
          # claim missing integration was verified or block builds of fixtures.
          node tools/audit-selected-feature-integration.mjs
          node --test test/cross-repo-source-pair-rc87.test.mjs
          python3 -m unittest discover -s test -p 'rc87_archive_hardening_test.py' -v
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Record SDK versions
        run: |
          flutter --version
          dart --version
      - name: Install app dependencies
        run: flutter pub get
      - name: Resolve dependencies for all optional packages
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r spec; do
            package="${spec%/pubspec.yaml}"
            echo "::group::Dependencies $package"
            (cd "$package" && flutter pub get)
            echo "::endgroup::"
          done < <(find packages -name pubspec.yaml -type f | sort)
      - name: Analyze Flutter application and feature libraries
        run: flutter analyze --no-fatal-infos
      - name: Test Flutter application
        run: flutter test --reporter expanded
      - name: Test all independent feature packages
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r spec; do
            package="${spec%/pubspec.yaml}"
            if [[ ! -d "$package/test" ]] || ! find "$package/test" -name '*_test.dart' -print -quit | grep -q .; then
              continue
            fi
            echo "::group::Testing $package"
            (cd "$package" && flutter pub get && flutter test --reporter expanded)
            echo "::endgroup::"
          done < <(find packages -name pubspec.yaml -type f | sort)

  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build Android APK (unsigned production, debug only)
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fable-rc49-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios-unsigned:
    name: iOS 27/iPadOS 27 scene launch and native simulator build
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Require Xcode 27 and iOS/iPadOS 27 Simulator SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          [[ "$(xcodebuild -version | head -1)" == "Xcode 27"* ]]
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          [[ "$sdk" == 27.* ]]
          echo "iOS SDK verified: $sdk"
      - name: Build iOS simulator (does not require signing)
        run: flutter build ios --simulator --debug --no-codesign
      - name: Verify compiled Runner UIScene manifest (iOS 27 prerequisite)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify-uiscene-rc120.py
          plist="build/ios/iphonesimulator/Runner.app/Info.plist"
          test -f "$plist"
          python3 tools/verify-uiscene-rc120.py "$plist"
          /usr/libexec/PlistBuddy -c "Print :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneDelegateClassName" "$plist"
          # A compiled plist alone does not prove UIScene launches successfully.
      - name: Launch iOS 27 Runner on iPhone and iPad simulators (UIScene smoke)
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          python3 tools/rc120_uiscene_simulator_smoke.py build/ios/iphonesimulator/Runner.app
