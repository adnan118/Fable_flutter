name: RC159 external staging HTTPS acceptance

on:
  push:
    branches: [rc159-independent-external-https-dart-smoke]
    paths:
      - tools/rc159-external-staging-https.dart
      - .github/workflows/rc159-external-staging-https.yml
  pull_request:
    paths:
      - tools/rc159-external-staging-https.dart
      - .github/workflows/rc159-external-staging-https.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc159-dart-https-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-https:
    name: External TLS and anonymous HTTP boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Check Dart source compiles and is statically valid
        run: |
          dart format tools/rc159-external-staging-https.dart
          dart analyze tools/rc159-external-staging-https.dart
      - name: Diagnose public DNS and HTTPS egress without credentials
        run: |
          set +e
          echo "RC159 DNS for dedicated staging hostname:"
          getent ahostsv4 fable-rc151-free-ephemeral-api.onrender.com | head -n 4
          echo "RC159 neutral public TLS control:"
          curl --silent --show-error --connect-timeout 8 --max-time 15 \
            --output /dev/null \
            --write-out 'control_http=%{http_code} tls_time=%{time_appconnect}s\\n' \
            https://example.com/
          echo "RC159 staging public TLS/read-only health:"
          curl --silent --show-error --connect-timeout 8 --max-time 30 \
            --output /dev/null \
            --write-out 'staging_http=%{http_code} tls_time=%{time_appconnect}s\\n' \
            https://fable-rc151-free-ephemeral-api.onrender.com/health
      - name: Exercise real external HTTPS without credentials or writes
        run: dart tools/rc159-external-staging-https.dart
